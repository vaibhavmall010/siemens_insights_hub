name: Siemens Insights Hub CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install flake8
          flake8 generator/ anomaly/ webhook/ tests/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402 \
            --exclude=__pycache__
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short --no-header

      - name: Smoke test simulator
        run: |
          python -c "
          import numpy as np
          from generator.simulator import generate_reading, to_line_protocol, MACHINES
          rng = np.random.default_rng(0)
          for mid in MACHINES:
              r = generate_reading(mid, rng)
              l = to_line_protocol(r)
              assert l.startswith('factory_sensors,')
              assert 'vibration_mm_s=' in l
          print(f'Simulator smoke test passed: {len(MACHINES)} machines')
          "

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build all Docker images
        run: |
          docker build -f generator/Dockerfile -t siemens-simulator .
          docker build -f anomaly/Dockerfile -t siemens-anomaly .
          docker build -f webhook/Dockerfile -t siemens-webhook .
      - name: Smoke test simulator container
        run: |
          docker run --rm siemens-simulator python -c "
          import numpy as np
          from generator.simulator import generate_reading, MACHINES
          rng = np.random.default_rng(0)
          for mid in MACHINES:
              r = generate_reading(mid, rng)
              assert r['machine_id'] == mid
          print('Container smoke test passed')
          "
